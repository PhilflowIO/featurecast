# The check a visitor sees.
#
# This is the repository's only workflow. Its origin is a private Forgejo
# instance without a runner for it, and GitHub is the mirror where a stranger
# who opens a pull request can see the run and re-start it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json,
      # and naming a second version makes it refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format

      # Most of the suite drives a real Chromium and encodes with a real
      # ffmpeg, so both are installed before it runs, not after.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # ffmpeg is not on the hosted image, and the smoothness suite generates
      # its own calibration clips with it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5

      # The hosted image exports CHROME_BIN for its own Google Chrome, and
      # featurecast honours CHROME_BIN. Left set, the check would run on
      # whatever Chrome the image ships instead of the pinned Chromium every
      # published number was measured on, so it is removed for the steps that
      # launch a browser. (Setting it empty is not an option: featurecast
      # refuses an empty CHROME_BIN rather than guess.)
      - name: Tests
        run: env -u CHROME_BIN pnpm test
      - name: Browser smoke test
        run: env -u CHROME_BIN pnpm demo:hello

      - name: Lint smoothness (ruff)
        run: uv run --project tools/smoothness ruff check tools/smoothness
      # Includes the slow video cases (ffmpeg-generated calibration clips,
      # cached under tools/smoothness/.eichvideos/) — this tool's whole premise
      # is that its tests prove the instrument moves, so nothing gets skipped.
      - name: Smoothness tests
        run: uv run --project tools/smoothness pytest tools/smoothness
