# The check a visitor sees.
#
# This is the repository's only workflow. Its origin is a private Forgejo
# instance without a runner for it, and GitHub is the mirror where a stranger
# who opens a pull request can see the run and re-start it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json,
      # and naming a second version makes it refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format

      # Most of the suite drives a real Chromium and encodes with a real
      # ffmpeg, so both are installed before it runs, not after.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # ffmpeg is not on the hosted image, and the suite encodes with a real
      # one.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The hosted runner has no GPU, so Chromium rasterizes in SwiftShader
      # and a recording would run at ~17fps while every frame-count and
      # duration check still passed. The switch that waves that through is
      # deliberately NOT set here: the tests that record live in their own
      # tier (`*.gpu.test.ts`) and run on a GPU host instead. What this job
      # runs is the portable tier — and that tier contains the two checks
      # that keep the split honest: `tests/tiers.test.ts` (nothing that
      # records may sit here, and this switch may not be set) and
      # `tests/gpu-receipt.test.ts` (the recording tier has actually run
      # against the current source). A recording change that skips the GPU
      # host therefore turns this job red, on a runner with no GPU at all.
      - name: Tests
        run: env -u CHROME_BIN pnpm test
      - name: Browser smoke test
        run: env -u CHROME_BIN pnpm demo:hello

  # The smoothness instrument is a separate program with its own toolchain,
  # and it is checked in its own job so that a red product check does not
  # hide it — and does not stop it from running at all, which is what a
  # single job does.
  smoothness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Lint (ruff)
        run: uv run --project tools/smoothness ruff check tools/smoothness
      # Includes the slow video cases (calibration clips built with the
      # pinned ffmpeg from this repository's release assets, cached under
      # tools/smoothness/.eichvideos/) — this tool's whole premise is that
      # its tests prove the instrument moves, so nothing gets skipped.
      # GITHUB_TOKEN only so that pinned encoder can be fetched while this
      # repository is private; once public the download needs no token.
      - name: Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project tools/smoothness pytest tools/smoothness
