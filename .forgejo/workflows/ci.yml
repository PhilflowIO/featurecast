name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: docker
    container:
      image: code.forgejo.org/forgejo/runner-images:node-22
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Unit tests
        run: pnpm test
      # The unit suite mocks the browser; this step proves a real Chromium starts.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke test
        run: pnpm demo:hello
      - name: Install uv and ffmpeg
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint smoothness (ruff)
        run: uv run --project tools/smoothness ruff check tools/smoothness
      # Includes the "langsam" video cases (ffmpeg-generated calibration clips,
      # cached under tools/smoothness/.eichvideos/) — this tool's whole premise
      # is that its tests prove the instrument moves, so nothing gets skipped.
      - name: Smoothness tests
        run: uv run --project tools/smoothness pytest tools/smoothness
